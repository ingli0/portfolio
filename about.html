<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INGKLI // CYBERCORE OS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/GlitchPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/FilmPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/renderers/AsciiEffect.js"></script>
<style>

@import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Mono&display=swap');

:root{
--pink:#ff00ff;
--cyan:#00ffff;
--bg:#000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
background:black;
color:white;
font-family:'Space Mono',monospace;
overflow:hidden;
}

/* CANVASES */

#matrix{position:fixed;top:0;left:0;z-index:0;opacity:.2}
#three{position:fixed;top:0;left:0;z-index:1}

/* SCANLINES */

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.05),
rgba(255,255,255,.05) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
z-index:8;
}

/* UI */

.ui{
position:relative;
z-index:10;
height:100vh;
display:flex;
flex-direction:column;
justify-content:space-between;
padding:30px;
}

/* GLITCH LOGO */

.logo{
font-family:'Syncopate';
font-size:2rem;
letter-spacing:10px;
animation:glitch 2s infinite;
}

@keyframes glitch{
0%{transform:skew(0)}
20%{transform:skew(2deg)}
40%{transform:skew(-2deg)}
60%{transform:skew(1deg)}
80%{transform:skew(-1deg)}
100%{transform:skew(0)}
}

/* CONTROL PANEL */

.panel{
width:300px;
background:rgba(0,0,0,.8);
border:1px solid #222;
backdrop-filter:blur(20px);
padding:20px;
}

.option{
width:100%;
background:transparent;
border:1px solid #333;
color:#888;
padding:10px;
margin-bottom:8px;
cursor:pointer;
transition:.3s;
}

.option:hover{
border-color:var(--cyan);
color:white;
}

.option.active{
border-color:var(--pink);
color:var(--pink);
}

/* TERMINAL */

.terminal{
margin-top:20px;
height:140px;
overflow:hidden;
font-size:10px;
color:var(--cyan);
line-height:14px;
}

/* FOOTER */

.footer{
display:flex;
justify-content:space-between;
font-size:11px;
border-top:1px solid #222;
padding-top:10px;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>
<canvas id="three"></canvas>

<div class="ui">

<header style="display:flex;justify-content:space-between">

<div class="logo">INGKLI_CORE</div>

<div>
<p style="color:var(--cyan)">AES256 ENCRYPTION</p>
<p id="coords">X:0 Y:0</p>
</div>

</header>

<div class="panel">

<div style="font-size:10px;color:var(--cyan);margin-bottom:10px">
> GEOMETRY_PROTOCOL
</div>

<button class="option active" onclick="changeShape('torus',this)">TORUS KNOT</button>
<button class="option" onclick="changeShape('sphere',this)">NEURAL SPHERE</button>
<button class="option" onclick="changeShape('crystal',this)">CYBER CRYSTAL</button>
<button class="option" onclick="changeShape('grid',this)">DATA GRID</button>
<button class="option" onclick="changeShape('dna',this)">DNA HELIX</button>
<button class="option" onclick="changeShape('cubeField',this)">CUBE FIELD</button>
<button class="option" onclick="changeShape('pyramid',this)">PYRAMID CORE</button>
<button class="option" onclick="changeShape('blackhole',this)">BLACK HOLE TORUS</button>

<div class="terminal" id="terminal"></div>

</div>

<div class="footer">

<div>
LATENCY 9ms<br>
CORE TEMP 39°C
</div>

<div>ROOT@INGKLI:~#</div>

<div>
STATUS STEALTH<br>
UPTIME 00:33:12
</div>

</div>

</div>

<script>

/* MATRIX RAIN */

const matrix=document.getElementById("matrix")
const ctx=matrix.getContext("2d")

matrix.width=window.innerWidth
matrix.height=window.innerHeight

const letters="01アカサタナハマヤラワ"
const size=14
const columns=matrix.width/size
const drops=[]

for(let x=0;x<columns;x++) drops[x]=1

function drawMatrix(){

ctx.fillStyle="rgba(0,0,0,.05)"
ctx.fillRect(0,0,matrix.width,matrix.height)

ctx.fillStyle="#00ffff"
ctx.font=size+"px monospace"

for(let i=0;i<drops.length;i++){

const text=letters[Math.floor(Math.random()*letters.length)]

ctx.fillText(text,i*size,drops[i]*size)

if(drops[i]*size>matrix.height && Math.random()>0.975)
drops[i]=0

drops[i]++

}

}

setInterval(drawMatrix,30)

/* THREE ENGINE */

let scene=new THREE.Scene()

let camera=new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

camera.position.z=30

let renderer=new THREE.WebGLRenderer({
canvas:document.getElementById("three"),
alpha:true,
antialias:true
})

renderer.setSize(window.innerWidth,window.innerHeight)

/* STARFIELD */

const starGeo=new THREE.BufferGeometry()
const starCount=10000
const starPos=new Float32Array(starCount*3)

for(let i=0;i<starCount;i++){

starPos[i*3]=(Math.random()-.5)*800
starPos[i*3+1]=(Math.random()-.5)*800
starPos[i*3+2]=(Math.random()-.5)*800

}

starGeo.setAttribute("position",new THREE.BufferAttribute(starPos,3))

const starMat=new THREE.PointsMaterial({
color:0xff00ff,
size:.7
})

const stars=new THREE.Points(starGeo,starMat)

scene.add(stars)

/* CURRENT OBJECT */

let currentObject

function clearScene(){

if(currentObject) scene.remove(currentObject)

}

/* SHAPES */

function createShape(type){

clearScene()

let geo,mat

mat=new THREE.MeshBasicMaterial({
color:0x00ffff,
wireframe:true,
transparent:true,
opacity:.35
})

if(type==="torus") geo=new THREE.TorusKnotGeometry(10,3,150,20)

if(type==="sphere") geo=new THREE.SphereGeometry(12,32,32)

if(type==="crystal") geo=new THREE.IcosahedronGeometry(12)

if(type==="grid") geo=new THREE.PlaneGeometry(50,50,30,30)

if(type==="pyramid") geo=new THREE.ConeGeometry(10,20,4)

if(type==="blackhole") geo=new THREE.TorusGeometry(12,5,16,100)

if(type==="cubeField"){

const group=new THREE.Group()

for(let i=0;i<200;i++){

const cube=new THREE.Mesh(
new THREE.BoxGeometry(1,1,1),
mat
)

cube.position.set(
(Math.random()-.5)*40,
(Math.random()-.5)*40,
(Math.random()-.5)*40
)

group.add(cube)

}

currentObject=group
scene.add(group)
return

}

if(type==="dna"){

const group=new THREE.Group()

for(let i=0;i<100;i++){

const sphere=new THREE.Mesh(
new THREE.SphereGeometry(.3,8,8),
mat
)

sphere.position.x=Math.sin(i*.3)*5
sphere.position.y=i*.3-15
sphere.position.z=Math.cos(i*.3)*5

group.add(sphere)

}

currentObject=group
scene.add(group)
return

}

currentObject=new THREE.Mesh(geo,mat)

scene.add(currentObject)

gsap.from(currentObject.scale,{
x:0,
y:0,
z:0,
duration:1,
ease:"elastic.out"
})

}
const effect = new THREE.AsciiEffect(renderer," .:-+*=%@#",{
invert:true
})
gsap.to(currentObject.rotation,{
y: "+=6",
duration:10,
repeat:-1,
ease:"none"
})
effect.setSize(window.innerWidth,window.innerHeight)

document.body.appendChild(effect.domElement)
effect.render(scene,camera)
createShape("torus")

/* ANIMATION */

function animate(){

requestAnimationFrame(animate)

stars.rotation.y+=0.0005

if(currentObject){

currentObject.rotation.y+=0.004
currentObject.rotation.x+=0.002

document.getElementById("coords").innerText=
"X:"+currentObject.rotation.x.toFixed(2)+" Y:"+currentObject.rotation.y.toFixed(2)

}
const composer = new THREE.EffectComposer(renderer)

const renderPass = new THREE.RenderPass(scene, camera)
composer.addPass(renderPass)

const bloom = new THREE.UnrealBloomPass(
new THREE.Vector2(window.innerWidth, window.innerHeight),
1.8,
1,
0
)

composer.addPass(bloom)

const glitch = new THREE.GlitchPass()
composer.addPass(glitch)
composer.render()
}

animate()

/* BUTTON SWITCH */

function changeShape(type,btn){

document.querySelectorAll(".option")
.forEach(b=>b.classList.remove("active"))

btn.classList.add("active")

createShape(type)

}

/* TERMINAL STREAM */

const terminal=document.getElementById("terminal")

const messages=[
"INITIALIZING INGKLI CORE...",
"CONNECTING DARKNET NODE...",
"LOADING GEOMETRY ENGINE...",
"GPU ACCELERATION ONLINE",
"CRYPTO LAYER ACTIVE",
"SECURE CHANNEL ESTABLISHED",
"ACCESS LEVEL: ROOT",
"CYBERSPACE LINKED"
]

let index=0

function terminalLine(){

const div=document.createElement("div")
terminal.appendChild(div)

let i=0

const text=messages[index]

const interval=setInterval(()=>{

div.textContent+=text[i]
i++

if(i>=text.length){

clearInterval(interval)

index=(index+1)%messages.length

setTimeout(terminalLine,500)

}

},35)

}

terminalLine()

/* RESIZE */

window.addEventListener("resize",()=>{

matrix.width=window.innerWidth
matrix.height=window.innerHeight

camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()

renderer.setSize(window.innerWidth,window.innerHeight)

})
 
</script>

</body>
</html>
